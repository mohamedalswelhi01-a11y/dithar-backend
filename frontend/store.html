<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دثار | متجر العبايات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--plum:#3B1E2B;--plum-deep:#2A1420;--gold:#C9A34E;--gold-soft:#E7D6A8;--cream:#F7F1E6;--ink:#241419;--line:#E1D3B8;--danger:#A23B3B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink);padding-bottom:74px}
h1,h2,h3,.brand{font-family:'Aref Ruqaa',serif}
a{color:inherit;text-decoration:none} button{font-family:inherit;cursor:pointer;border:none}
.topbar{position:sticky;top:0;z-index:40;background:var(--plum-deep);color:var(--gold-soft);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.brand{font-size:22px;color:var(--gold)}.err{color:var(--danger);font-size:12px;margin-top:6px}
.hidden{display:none}
.banner-wrap{margin:14px;border-radius:18px;overflow:hidden;position:relative;height:150px}
.banner-slide{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;color:var(--cream);
  background:linear-gradient(135deg,var(--plum),#522A3B 60%,var(--gold) 140%);opacity:0;transition:opacity .5s;pointer-events:none}
.banner-slide.on{opacity:1;pointer-events:auto}
.banner-slide .tag{font-size:12px;color:var(--gold-soft);display:block;margin-bottom:6px}
.banner-slide h2{font-size:26px}
.banner-dots{position:absolute;bottom:10px;right:22px;display:flex;gap:5px;z-index:5}
.banner-dots span{width:6px;height:6px;border-radius:50%;background:rgba(247,241,230,.4)}
.banner-dots span.on{background:var(--gold)}
.section{padding:6px 16px 20px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.section-head h3{font-size:19px}
.section-head .more{font-size:12px;color:var(--plum);opacity:.7}
.cats{display:flex;gap:14px;overflow-x:auto;padding-bottom:4px}
.cat{flex:0 0 auto;width:70px;text-align:center;font-size:12px}
.cat .ic{width:58px;height:58px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.card .ph{height:130px;background:linear-gradient(160deg,#EFE6D2,#E3D5B6);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--plum);opacity:.55}
.card .fav{position:absolute;top:6px;left:6px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;font-size:15px;color:#9a8a70}
.card .fav.on{color:var(--danger)}
.card .info{padding:10px 10px 12px}
.card .name{font-size:13.5px;font-weight:500;margin-bottom:3px}
.card .price{font-size:13px;color:var(--plum);font-weight:700}
.card .price .old{color:#9a8a70;text-decoration:line-through;font-weight:400;font-size:11.5px;margin-inline-start:6px}
.card .addcart{margin-top:8px;width:100%;background:var(--plum);color:var(--gold-soft);font-size:12.5px;padding:7px;border-radius:9px}
